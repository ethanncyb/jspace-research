[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jspace-research"
version = "0.1.0"
description = "Focused J-space prompt-injection layer-selection and disruption research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "huggingface-hub",
  "jsonlines",
  "matplotlib",
  "nltk",
  "numpy",
  "pandas",
  "pyarrow",
  "pyyaml",
  "openai>=1.66",
  "rouge-score",
  "scikit-learn",
  "torch",
  "tqdm",
  "transformers>=5.5",
  "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jspace-phase1 = "jspace_research.phase1.cli:main"
jspace-phase2 = "jspace_research.phase2.cli:main"
jspace-run = "jspace_research.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

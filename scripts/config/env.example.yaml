# Copy to scripts/config/env.yaml and edit for your machine.
# Machine-local paths and credential file locations only.
# Do not commit env.yaml if it contains secret paths on shared systems.

runtime:
  use_project_venv: true
  venv_dir: .venv
  python: null

paths:
  benchmarks_root: ../jspace-benchmarks
  bipia_checkout: BIPIA
  agentdojo_checkout: null
  injecagent_checkout: null
  webqa_train_path: null
  summarization_train_path: null

credentials:
  # Read secrets from files (paths expand ~). Leave null to use env vars only.
  hf_token_file: null
  openrouter_api_key_file: null

  # Environment variable names checked before reading token files.
  hf_token_env: HF_TOKEN
  openrouter_api_key_env: OPENROUTER_API_KEY
